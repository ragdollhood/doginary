<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Våra hundar — Doginary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#FAF6EF; --surface:#FFFFFF; --surface-2:#F3EEE3;
  --ink:#1C2420; --ink-soft:#54615B;
  --pine:#22403A; --pine-deep:#122420; --pine-tint:#E7EFEC;
  --honey:#C08F45; --honey-deep:#A0762F; --honey-tint:#F5E9D4;
  --line:#E4DDCC; --line-soft:#EEE8DA;
  --radius-s:6px; --radius-m:10px; --radius-l:16px;
  --shadow: 0 1px 2px rgba(28,36,32,.05), 0 8px 24px -12px rgba(28,36,32,.18);
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Inter', -apple-system, sans-serif;
}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1A211D; --surface-2:#212823;
  --ink:#ECE7DA; --ink-soft:#A7B0A9;
  --pine:#8FBBAE; --pine-deep:#0D1613; --pine-tint:#1C2925;
  --honey:#DCAE68; --honey-deep:#EAC48A; --honey-tint:#2A2418;
  --line:#2A322C; --line-soft:#232B26;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121815; --surface:#1A211D; --surface-2:#212823;
    --ink:#ECE7DA; --ink-soft:#A7B0A9;
    --pine:#8FBBAE; --pine-deep:#0D1613; --pine-tint:#1C2925;
    --honey:#DCAE68; --honey-deep:#EAC48A; --honey-tint:#2A2418;
    --line:#2A322C; --line-soft:#232B26;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.55;}
img{max-width:100%;display:block;}
button{font-family:inherit;}
a{color:inherit;}

.top{
  position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:14px; padding:16px 26px;
}
.brand{display:flex; flex-direction:column;}
.brand-name{font-family:var(--font-display); font-size:20px; font-weight:500;}
.brand-tag{font-size:12px; color:var(--ink-soft);}
.lang-switch{display:flex; gap:4px; margin-left:auto;}
.lang-btn{
  border:1px solid var(--line); background:var(--surface); border-radius:20px; padding:5px 11px; font-size:13px;
  cursor:pointer; display:flex; align-items:center; gap:6px; color:var(--ink-soft);
}
.lang-btn.active{border-color:var(--honey); color:var(--ink); font-weight:600; background:var(--honey-tint);}

.wrap{max-width:1180px; margin:0 auto; padding:30px 26px 60px;}
.hero h1{font-family:var(--font-display); font-size:32px; font-weight:500; margin:0 0 6px;}
.hero p{color:var(--ink-soft); max-width:60ch; margin:0 0 24px;}

.filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px;}
.chip-filter{
  border:1px solid var(--line); background:var(--surface); border-radius:20px; padding:7px 14px; font-size:13px;
  cursor:pointer; color:var(--ink-soft);
}
.chip-filter.active{background:var(--pine); color:#F4EFE2; border-color:var(--pine);}

.grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;}
.dog-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden; cursor:pointer; transition:transform .12s ease, border-color .12s ease;}
.dog-card:hover{border-color:var(--honey); transform:translateY(-2px);}
.dog-photo{height:150px; background:var(--pine-tint); display:flex; align-items:center; justify-content:center; position:relative;}
.dog-photo svg{width:56px; height:56px; color:var(--pine); opacity:.55;}
.status-chip{position:absolute; top:10px; right:10px; font-size:10.5px; padding:3px 9px; border-radius:20px; font-weight:600; background:var(--surface); border:1px solid var(--line);}
.status-chip.puppy{background:var(--honey-tint); color:var(--honey-deep); border-color:transparent;}
.status-chip.adult{background:var(--pine-tint); color:var(--pine); border-color:transparent;}
.status-chip.retired,.status-chip.deceased{background:var(--surface-2); color:var(--ink-soft); border-color:transparent;}
.dog-body{padding:14px 16px 16px;}
.dog-name{font-family:var(--font-display); font-size:17px; font-weight:500;}
.dog-meta{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
.dog-tags{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
.tag{font-size:10.5px; padding:3px 8px; border-radius:5px; background:var(--surface-2); color:var(--ink-soft);}

.empty{text-align:center; padding:60px 20px; color:var(--ink-soft); border:1.5px dashed var(--line); border-radius:var(--radius-m);}

.overlay{position:fixed; inset:0; background:rgba(15,20,17,.45); z-index:100; display:none; align-items:stretch; justify-content:flex-end;}
.overlay.open{display:flex;}
.drawer{width:min(560px,94vw); background:var(--bg); height:100%; overflow-y:auto; box-shadow:-14px 0 40px rgba(0,0,0,.2);}
.drawer-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:22px 24px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg);}
.drawer-title{font-family:var(--font-display); font-size:22px; font-weight:500;}
.drawer-body{padding:20px 24px 40px;}
.close-x{background:none; border:none; cursor:pointer; color:var(--ink-soft); padding:4px;}

.info-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; font-size:13.5px;}
.info-grid .l{font-size:11.5px; color:var(--ink-soft); text-transform:none;}
.info-grid .v{font-weight:500; margin-top:2px;}

.pedigree-tree{display:flex; align-items:stretch; gap:0; overflow-x:auto; padding:10px 2px 6px;}
.ped-col{display:flex; flex-direction:column; justify-content:space-around; gap:10px; padding:0 8px;}
.ped-node{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-s); padding:8px 11px; min-width:140px; font-size:11.5px;}
.ped-node.self{border-color:var(--honey); background:var(--honey-tint); min-width:160px;}
.ped-node .n{font-weight:700; font-size:12.5px;}

footer.disclaimer{max-width:1180px; margin:40px auto 0; padding:24px 26px 50px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink-soft);}
footer.disclaimer h2{font-size:12px; text-transform:none; color:var(--ink); margin:0 0 8px;}
footer.disclaimer p{margin:0 0 8px;}

@media(max-width:640px){ .top,.wrap{padding-left:16px; padding-right:16px;} .info-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div class="top">
  <div class="brand">
    <div class="brand-name" id="kennelNameLabel">Kennel</div>
    <div class="brand-tag" data-i18n="brandTag"></div>
  </div>
  <div class="lang-switch">
    <button class="lang-btn" data-lang="sv">🇸🇪 SV</button>
    <button class="lang-btn" data-lang="en">🇬🇧 EN</button>
  </div>
</div>

<div class="wrap">
  <div class="hero">
    <h1 data-i18n="heroTitle"></h1>
    <p data-i18n="heroSub"></p>
  </div>
  <div class="filter-row" id="filterRow"></div>
  <div class="grid-cards" id="dogGrid"><div class="empty" data-i18n="loading"></div></div>
</div>

<footer class="disclaimer">
  <h2 data-i18n="disclaimer.title"></h2>
  <p data-i18n="disclaimer.p1"></p>
  <p data-i18n="disclaimer.p2"></p>
  <p data-i18n="disclaimer.p3"></p>
  <p data-i18n="disclaimer.p4"></p>
  <p data-i18n="disclaimer.p5"></p>
</footer>

<div class="overlay" id="overlay"><div class="drawer" id="drawer"></div></div>

<script>
/* ==== SAMMA SUPABASE-PROJEKT SOM BREEDER HUB — fyll i samma värden ==== */
const SUPABASE_URL = 'https://jjbziqsjapyiihdrlnsw.supabase.co/rest/v1/';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpqYnppcXNqYXB5aWloZHJsbnN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2ODkxMTgsImV4cCI6MjEwNDI2NTExOH0.MEzM2wN8eENlVBAsN-I6hhIYFnF53avdFacfbNwCBBw';
const sb = (SUPABASE_URL.includes('DITT-PROJEKT') || !window.supabase)
  ? null
  : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DOG_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 5.2C8.5 4 6.8 4 6 5c-1 1.2-.4 3.4.6 4.4M14 5.2c1.5-1.2 3.2-1.2 4 0 1 1 .4 3.2-.6 4M12 8c-3.5 0-6 2.6-6 6.4 0 3.4 2.7 5.6 6 5.6s6-2.2 6-5.6C18 10.6 15.5 8 12 8z"/></svg>';

/* ---------------- I18N ---------------- */
const translations = {
  sv:{
    brandTag:'Uppfödarens hundar',
    heroTitle:'Våra hundar',
    heroSub:'En översikt över kennelns aktiva hundar, avelsdjur och pensionärer — med hälsoresultat, meriter och stamtavla.',
    loading:'Laddar hundar…',
    empty:'Inga hundar matchar filtret just nu.',
    filters:{all:'Alla', puppy:'Valpar', adult:'Vuxna', retired:'Pensionerade', deceased:'Till minne'},
    status:{puppy:'Valp', adult:'Vuxen', retired:'Pensionerad', deceased:'Avliden'},
    tabs:{info:'Info', pedigree:'Stamtavla'},
    labels:{callName:'Kallelsenamn', sex:'Kön', breed:'Ras', color:'Färg', born:'Född', age:'Ålder', reg:'Registreringsnr',
      height:'Mankhöjd', hips:'HD', elbows:'AD', eyes:'Ögonlysning', dna:'DNA-tester', titles:'Meriter', parents:'Föräldrar',
      sire:'Far', dam:'Mor', unknown:'Okänd', na:'—'},
    disclaimer:{
      title:'Ansvarsfriskrivning',
      p1:'Informationen på denna sida tillhandahålls av uppfödaren och är avsedd som allmän information om hundar, kullar, hälsodata, stamtavlor och planerad eller genomförd avel.',
      p2:'Även om vi strävar efter att hålla informationen korrekt och uppdaterad kan vi inte garantera att alla uppgifter är fullständiga, aktuella eller fria från fel. Hälsotester, meriter, stamtavleuppgifter och annan information baseras på uppgifter som registrerats av uppfödaren eller erhållits från externa källor.',
      p3:'Informationen ska inte betraktas som veterinärmedicinsk rådgivning, juridisk rådgivning eller garanti för en hunds framtida hälsa, egenskaper, temperament eller avelsvärde.',
      p4:'Samtliga personuppgifter hanteras enligt gällande dataskyddslagstiftning. Kontaktuppgifter och information om valpköpare, intressenter och andra privatpersoner publiceras inte utan uttryckligt samtycke.',
      p5:'Besökare ansvarar själva för att verifiera viktig information direkt med uppfödaren innan beslut om köp, reservation eller annan överenskommelse fattas. Genom att använda denna sida accepterar du att informationen tillhandahålls i befintligt skick och att uppfödaren samt plattformen inte kan hållas ansvariga för eventuella beslut eller åtgärder som grundas på information som publiceras här.'
    }
  },
  en:{
    brandTag:"The breeder's dogs",
    heroTitle:'Our dogs',
    heroSub:"An overview of the kennel's active dogs, breeding animals and retirees — with health results, titles and pedigree.",
    loading:'Loading dogs…',
    empty:'No dogs match this filter right now.',
    filters:{all:'All', puppy:'Puppies', adult:'Adults', retired:'Retired', deceased:'In memoriam'},
    status:{puppy:'Puppy', adult:'Adult', retired:'Retired', deceased:'Deceased'},
    tabs:{info:'Info', pedigree:'Pedigree'},
    labels:{callName:'Call name', sex:'Sex', breed:'Breed', color:'Color', born:'Born', age:'Age', reg:'Registration no.',
      height:'Height', hips:'Hips', elbows:'Elbows', eyes:'Eye exam', dna:'DNA tests', titles:'Titles', parents:'Parents',
      sire:'Sire', dam:'Dam', unknown:'Unknown', na:'—'},
    disclaimer:{
      title:'Disclaimer',
      p1:'The information on this page is provided by the breeder and is intended as general information about dogs, litters, health data, pedigrees, and planned or completed breeding.',
      p2:'While we strive to keep the information accurate and up to date, we cannot guarantee that all details are complete, current, or free of errors. Health tests, titles, pedigree data, and other information are based on records entered by the breeder or obtained from external sources.',
      p3:"This information should not be regarded as veterinary advice, legal advice, or a guarantee of a dog's future health, traits, temperament, or breeding value.",
      p4:'All personal data is handled in accordance with applicable data protection legislation. Contact details and information about puppy buyers, prospective buyers, and other private individuals are not published without explicit consent.',
      p5:'Visitors are responsible for verifying important information directly with the breeder before making any decision regarding purchase, reservation, or other agreement. By using this page, you accept that the information is provided "as is" and that neither the breeder nor the platform can be held liable for any decisions or actions based on information published here.'
    }
  }
};
let lang = (localStorage.getItem('publicdogs_lang')) || (navigator.language||'sv').slice(0,2);
if(!translations[lang]) lang = 'sv';
function t(path){ return path.split('.').reduce((o,k)=>o?.[k], translations[lang]); }

function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const val = t(el.getAttribute('data-i18n'));
    if(val) el.textContent = val;
  });
  document.querySelectorAll('.lang-btn').forEach(b=> b.classList.toggle('active', b.dataset.lang===lang));
  renderFilters();
  drawGrid();
}
document.querySelectorAll('.lang-btn').forEach(b=>{
  b.addEventListener('click', ()=>{ lang = b.dataset.lang; localStorage.setItem('publicdogs_lang', lang); applyLang(); });
});

/* ---------------- DATA ---------------- */
let DOGS = [];
let filter = 'all';

async function loadKennelData(){
  if(sb){
    try{
      const kennelParam = new URLSearchParams(location.search).get('kennel');
      let query = sb.from('kennel_public').select('data, kennel_id, updated_at');
      query = kennelParam ? query.eq('kennel_id', kennelParam).maybeSingle() : query.order('updated_at',{ascending:false}).limit(1).maybeSingle();
      const { data, error } = await query;
      if(error) throw error;
      return data?.data || {};
    }catch(e){
      console.error('Kunde inte hämta data från Supabase', e);
      document.getElementById('dogGrid').innerHTML = `<div class="empty">${lang==='sv'?'Kunde inte hämta hundarna just nu. Försök igen senare.':'Could not load the dogs right now. Please try again later.'}</div>`;
      return {};
    }
  }
  document.getElementById('dogGrid').innerHTML = `<div class="empty">${lang==='sv'?'Sidan är inte ansluten till någon databas ännu.':'This page is not connected to a database yet.'}</div>`;
  return {};
}
function dogById(id){ return DOGS.find(d=>d.id===id); }
function ageFromDob(dob){
  if(!dob) return t('labels.na');
  const d = new Date(dob+'T00:00:00'); const now = new Date();
  let months = (now.getFullYear()-d.getFullYear())*12 + (now.getMonth()-d.getMonth());
  if(months < 1){ const days = Math.round((now-d)/86400000); return days + (lang==='sv'?' dagar':' days'); }
  if(months < 24) return months + (lang==='sv'?' mån':' mo');
  return (months/12).toFixed(1).replace('.0','') + (lang==='sv'?' år':' yr');
}
function fmtDate(s){
  if(!s) return t('labels.na');
  const d = new Date(s+'T00:00:00'); if(isNaN(d)) return s;
  return d.toLocaleDateString(lang==='sv'?'sv-SE':'en-GB',{day:'numeric',month:'short',year:'numeric'});
}

function renderFilters(){
  const statuses = ['all','puppy','adult','retired','deceased'];
  document.getElementById('filterRow').innerHTML = statuses.map(s=>
    `<button class="chip-filter ${filter===s?'active':''}" data-f="${s}">${t('filters.'+s)}</button>`
  ).join('');
  document.querySelectorAll('.chip-filter').forEach(b=> b.addEventListener('click', ()=>{ filter=b.dataset.f; drawGrid(); }));
}

function drawGrid(){
  const grid = document.getElementById('dogGrid');
  let list = DOGS.filter(d=> filter==='all' || d.status===filter);
  grid.innerHTML = list.map(d=>`
    <div class="dog-card" data-id="${d.id}">
      <div class="dog-photo"><span class="status-chip ${d.status}">${t('status.'+d.status)}</span>${DOG_ICON}</div>
      <div class="dog-body">
        <div class="dog-name">${d.name}</div>
        <div class="dog-meta">${d.breed} · ${d.sex==='Hane'?(lang==='sv'?'Hane':'Male'):(lang==='sv'?'Tik':'Female')} · ${ageFromDob(d.dob)}</div>
        <div class="dog-tags">${d.color?`<span class="tag">${d.color}</span>`:''}${d.hips?`<span class="tag">${t('labels.hips')} ${d.hips}</span>`:''}${d.titles?.[0]?`<span class="tag">${d.titles[0]}</span>`:''}</div>
      </div>
    </div>
  `).join('') || `<div class="empty" style="grid-column:1/-1;">${t('empty')}</div>`;
  grid.querySelectorAll('.dog-card').forEach(c=> c.addEventListener('click', ()=> openDogDetail(c.dataset.id)));
}

function pedNode(dog, isSelf){
  if(!dog) return `<div class="ped-node" style="opacity:.4;"><div class="n">${t('labels.unknown')}</div></div>`;
  return `<div class="ped-node ${isSelf?'self':''}"><div class="n">${dog.name}</div><div style="color:var(--ink-soft); margin-top:2px;">${dog.breed}</div>
    ${dog.titles?.[0]?`<div class="tag" style="display:inline-block; margin-top:5px;">${dog.titles[0]}</div>`:''}</div>`;
}

function openDogDetail(id){
  const d = dogById(id);
  if(!d) return;
  const sire = d.sire ? dogById(d.sire) : null;
  const dam = d.dam ? dogById(d.dam) : null;
  const L = translations[lang].labels;
  document.getElementById('drawer').innerHTML = `
    <div class="drawer-head">
      <div><div class="drawer-title">${d.name}</div><div style="font-size:12.5px;color:var(--ink-soft);">${d.regName||''}</div></div>
      <button class="close-x" id="closeDrawerBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="drawer-body">
      <div class="info-grid">
        <div><div class="l">${L.callName}</div><div class="v">${d.callName||d.name}</div></div>
        <div><div class="l">${L.sex}</div><div class="v">${d.sex}</div></div>
        <div><div class="l">${L.breed}</div><div class="v">${d.breed}</div></div>
        <div><div class="l">${L.color}</div><div class="v">${d.color||L.na}</div></div>
        <div><div class="l">${L.born}</div><div class="v">${fmtDate(d.dob)}</div></div>
        <div><div class="l">${L.age}</div><div class="v">${ageFromDob(d.dob)}</div></div>
        <div><div class="l">${L.reg}</div><div class="v">${d.reg||L.na}</div></div>
        <div><div class="l">${L.height}</div><div class="v">${d.height?d.height+' cm':L.na}</div></div>
        <div><div class="l">${L.hips}</div><div class="v">${d.hips||L.na}</div></div>
        <div><div class="l">${L.elbows}</div><div class="v">${d.elbows||L.na}</div></div>
        <div><div class="l">${L.eyes}</div><div class="v">${d.eyes||L.na}</div></div>
        <div><div class="l">${L.dna}</div><div class="v">${d.dna||L.na}</div></div>
      </div>
      ${d.titles?.length?`<div style="margin-top:16px;"><div class="l" style="margin-bottom:6px;">${L.titles}</div><div class="dog-tags">${d.titles.map(x=>`<span class="tag">${x}</span>`).join('')}</div></div>`:''}
      <div style="margin-top:22px;"><div class="l" style="margin-bottom:8px;">${translations[lang].tabs.pedigree}</div>
        <div class="pedigree-tree">
          <div class="ped-col">${pedNode(d,true)}</div>
          <div class="ped-col">${pedNode(sire)}${pedNode(dam)}</div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('closeDrawerBtn').addEventListener('click', closeDrawer);
  document.getElementById('overlay').classList.add('open');
}
function closeDrawer(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeDrawer(); });

/* ---------------- INIT ---------------- */
(async function init(){
  applyLang();
  const kd = await loadKennelData();
  DOGS = kd.dogs || [];
  document.getElementById('kennelNameLabel').textContent = kd.kennelName || 'Kennel';
  drawGrid();
})();
</script>
</body>
</html>
