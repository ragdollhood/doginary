<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Återställ lösenord | Doginary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#FAF6EF;--surface:#FFF;--surface-2:#F3EEE3;--ink:#1C2420;--soft:#5D6963;
      --pine:#22403A;--pine-deep:#122420;--honey:#C08F45;--line:#E4DDCC;
      --danger:#AF5138;--danger-bg:#F6E4DE;--ok:#3F7251;--ok-bg:#E7F0E7;
      --shadow:0 22px 70px rgba(28,36,32,.15);--display:'Fraunces',Georgia,serif;--body:'Inter',sans-serif;
    }
    @media(prefers-color-scheme:dark){:root{--bg:#121815;--surface:#1A211D;--surface-2:#212823;--ink:#ECE7DA;--soft:#A7B0A9;--pine:#8FBBAE;--pine-deep:#0D1613;--honey:#DCAE68;--line:#2A322C;--danger:#E09A83;--danger-bg:#2E211C;--ok:#91C09E;--ok-bg:#1B2620;--shadow:0 22px 70px rgba(0,0,0,.45)}}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{min-height:100vh;font-family:var(--body);color:var(--ink);background:radial-gradient(900px 480px at 50% -10%,rgba(192,143,69,.18),transparent 68%),var(--bg);display:grid;place-items:center;padding:28px 18px}
    .shell{width:min(440px,100%)}
    .brand{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:20px;color:var(--pine)}
    .brand-mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#80B8E8,#DCECF8);border:1px solid rgba(34,64,58,.1)}
    .brand-mark svg{width:28px;height:28px;color:#07366A}
    .brand-name{font:600 34px/1 var(--display);letter-spacing:-.03em}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px 32px 28px;box-shadow:var(--shadow)}
    .eyebrow{text-align:center;color:var(--honey);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
    h1{font:600 30px/1.18 var(--display);text-align:center;margin:0 0 9px}
    .intro{text-align:center;color:var(--soft);font-size:14px;line-height:1.55;margin:0 0 24px}
    label{display:block;font-size:12.5px;font-weight:700;color:var(--soft);margin:14px 0 6px}
    .password-wrap{position:relative}
    input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 45px 11px 12px;background:var(--surface-2);color:var(--ink);font:14px var(--body);outline:none}
    input:focus{border-color:var(--honey);box-shadow:0 0 0 3px rgba(192,143,69,.14)}
    .toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--soft);padding:6px;cursor:pointer;font:600 11px var(--body)}
    .hint{font-size:11.5px;color:var(--soft);margin-top:6px}
    button[type=submit]{width:100%;margin-top:20px;border:0;border-radius:8px;padding:12px 16px;background:var(--pine);color:#F7F2E8;font:600 14.5px var(--body);cursor:pointer}
    button[type=submit]:hover{background:var(--pine-deep)}
    button[type=submit]:disabled{opacity:.58;cursor:not-allowed}
    .message{display:none;border-radius:8px;margin-top:16px;padding:11px 12px;font-size:12.5px;line-height:1.45}
    .message.error{display:block;color:var(--danger);background:var(--danger-bg)}
    .message.success{display:block;color:var(--ok);background:var(--ok-bg)}
    .message.info{display:block;color:var(--soft);background:var(--surface-2)}
    .back{display:block;text-align:center;margin-top:18px;color:var(--soft);font-size:12.5px;text-decoration:none}
    .back:hover{color:var(--honey);text-decoration:underline}
    .lang{display:flex;justify-content:center;gap:7px;margin-top:16px}
    .lang button{border:1px solid var(--line);background:var(--surface);color:var(--soft);border-radius:20px;padding:6px 10px;font:600 11px var(--body);cursor:pointer}
    .lang button.active{border-color:var(--honey);color:var(--ink)}
    .hidden{display:none!important}
    @media(max-width:480px){.card{padding:28px 21px 24px}.brand-name{font-size:30px}h1{font-size:27px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand" aria-label="Doginary">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 4c-1.8 0-3.1.8-4.1 2.1C12.4 5.4 11.2 5 9.8 5 6.6 5 4 7.6 4 10.8c0 4.8 4.5 8.1 8 9.7 3.5-1.6 8-4.9 8-9.7 0-1.5-.6-2.9-1.5-4 .5-.8.6-1.8.2-2.8-.4.1-.8 0-1.2 0z"/></svg></span>
      <span class="brand-name">Doginary</span>
    </div>

    <section class="card">
      <div class="eyebrow">Breeder Hub</div>
      <h1 id="title">Välj ett nytt lösenord</h1>
      <p class="intro" id="intro">Ange ett nytt lösenord för ditt Doginary-konto.</p>

      <form id="resetForm" novalidate>
        <label for="password" id="passwordLabel">Nytt lösenord</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required disabled>
          <button type="button" class="toggle" data-target="password" id="showOne">Visa</button>
        </div>
        <div class="hint" id="passwordHint">Minst 8 tecken.</div>

        <label for="confirmPassword" id="confirmLabel">Bekräfta nytt lösenord</label>
        <div class="password-wrap">
          <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required disabled>
          <button type="button" class="toggle" data-target="confirmPassword" id="showTwo">Visa</button>
        </div>

        <button id="submitBtn" type="submit" disabled>Spara nytt lösenord</button>
        <div id="message" class="message info" role="status" aria-live="polite">Kontrollerar återställningslänken…</div>
      </form>

      <a class="back" href="breeder-hub.html" id="backLink">Tillbaka till inloggningen</a>
    </section>

    <div class="lang" aria-label="Language">
      <button type="button" id="svBtn" class="active">Svenska</button>
      <button type="button" id="enBtn">English</button>
    </div>
  </main>

<script>
  const SUPABASE_URL = 'https://jjbziqsjapyiihdrlnsw.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpqYnppcXNqYXB5aWloZHJsbnN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2ODkxMTgsImV4cCI6MjEwNDI2NTExOH0.MEzM2wN8eENlVBAsN-I6hhIYFnF53avdFacfbNwCBBw';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const copy = {
    sv:{title:'Välj ett nytt lösenord',intro:'Ange ett nytt lösenord för ditt Doginary-konto.',passwordLabel:'Nytt lösenord',confirmLabel:'Bekräfta nytt lösenord',hint:'Minst 8 tecken.',save:'Spara nytt lösenord',show:'Visa',hide:'Dölj',checking:'Kontrollerar återställningslänken…',invalid:'Återställningslänken är ogiltig eller har gått ut. Begär en ny länk från inloggningssidan.',short:'Lösenordet måste innehålla minst 8 tecken.',mismatch:'Lösenorden matchar inte.',saving:'Sparar…',success:'Lösenordet har uppdaterats. Du skickas till inloggningen…',generic:'Det gick inte att uppdatera lösenordet. Begär en ny återställningslänk och försök igen.',back:'Tillbaka till inloggningen'},
    en:{title:'Choose a new password',intro:'Enter a new password for your Doginary account.',passwordLabel:'New password',confirmLabel:'Confirm new password',hint:'At least 8 characters.',save:'Save new password',show:'Show',hide:'Hide',checking:'Checking the recovery link…',invalid:'The recovery link is invalid or has expired. Request a new link from the login page.',short:'The password must contain at least 8 characters.',mismatch:'The passwords do not match.',saving:'Saving…',success:'Your password has been updated. Redirecting to login…',generic:'The password could not be updated. Request a new recovery link and try again.',back:'Back to login'}
  };
  let lang = localStorage.getItem('breederhub_lang') === 'en' ? 'en' : 'sv';
  let recoveryReady = false;
  const form = document.getElementById('resetForm');
  const password = document.getElementById('password');
  const confirmPassword = document.getElementById('confirmPassword');
  const submitBtn = document.getElementById('submitBtn');
  const message = document.getElementById('message');

  function setMessage(text, type='info'){ message.textContent=text; message.className='message '+type; }
  function applyLanguage(){
    const c=copy[lang]; document.documentElement.lang=lang; document.getElementById('title').textContent=c.title;
    document.getElementById('intro').textContent=c.intro; document.getElementById('passwordLabel').textContent=c.passwordLabel;
    document.getElementById('confirmLabel').textContent=c.confirmLabel; document.getElementById('passwordHint').textContent=c.hint;
    if(!submitBtn.disabled || recoveryReady) submitBtn.textContent=c.save; document.getElementById('backLink').textContent=c.back;
    document.getElementById('svBtn').classList.toggle('active',lang==='sv'); document.getElementById('enBtn').classList.toggle('active',lang==='en');
    document.querySelectorAll('.toggle').forEach(b=>b.textContent=(document.getElementById(b.dataset.target).type==='password'?c.show:c.hide));
  }
  document.getElementById('svBtn').onclick=()=>{lang='sv';localStorage.setItem('breederhub_lang',lang);applyLanguage()};
  document.getElementById('enBtn').onclick=()=>{lang='en';localStorage.setItem('breederhub_lang',lang);applyLanguage()};
  document.querySelectorAll('.toggle').forEach(btn=>btn.addEventListener('click',()=>{const input=document.getElementById(btn.dataset.target);input.type=input.type==='password'?'text':'password';btn.textContent=input.type==='password'?copy[lang].show:copy[lang].hide;}));

  function enableForm(){
    recoveryReady=true; password.disabled=false; confirmPassword.disabled=false; submitBtn.disabled=false;
    submitBtn.textContent=copy[lang].save; message.className='message hidden'; password.focus();
  }
  function showInvalid(){
    recoveryReady=false; password.disabled=true; confirmPassword.disabled=true; submitBtn.disabled=true;
    setMessage(copy[lang].invalid,'error');
  }

  sb.auth.onAuthStateChange((event, session)=>{
    if(event === 'PASSWORD_RECOVERY' && session) enableForm();
  });

  async function initialise(){
    applyLanguage(); setMessage(copy[lang].checking,'info');
    const hash = new URLSearchParams(location.hash.replace(/^#/,''));
    const query = new URLSearchParams(location.search);
    if(hash.get('error_description') || query.get('error_description')){ showInvalid(); return; }
    await new Promise(resolve=>setTimeout(resolve,450));
    const {data:{session},error}=await sb.auth.getSession();
    const looksLikeRecovery = hash.get('type')==='recovery' || query.get('type')==='recovery' || hash.has('access_token') || query.has('code');
    if(!error && session && looksLikeRecovery) enableForm();
    else if(!recoveryReady) showInvalid();
  }

  form.addEventListener('submit',async e=>{
    e.preventDefault(); if(!recoveryReady) return;
    const c=copy[lang];
    if(password.value.length<8){setMessage(c.short,'error');password.focus();return;}
    if(password.value!==confirmPassword.value){setMessage(c.mismatch,'error');confirmPassword.focus();return;}
    submitBtn.disabled=true; submitBtn.textContent=c.saving; setMessage(c.saving,'info');
    const {error}=await sb.auth.updateUser({password:password.value});
    if(error){console.error('Password update failed',error);setMessage(c.generic,'error');submitBtn.disabled=false;submitBtn.textContent=c.save;return;}
    setMessage(c.success,'success');
    await sb.auth.signOut();
    setTimeout(()=>location.replace('breeder-hub.html'),1200);
  });

  initialise();
</script>
</body>
</html>
